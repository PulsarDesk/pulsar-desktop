# Pulsar: kernels built with CONFIG_USBIP_DEBUG (e.g. the Rockchip 5.10 vendor kernel) turn
# on every usbip debug flag by default, which logs each URB of the virtual DualSense (~1000
# lines/s) to the kernel log. Off. Kernels without the parameter ignore it with a warning.
options usbip-core usbip_debug_flag=0
