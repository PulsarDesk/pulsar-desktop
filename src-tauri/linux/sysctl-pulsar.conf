# Pulsar: room for a game stream's bursts in the UDP socket buffers.
#
# A 30-150 Mbit stream delivers a keyframe or FEC burst of several hundred datagrams within a
# few milliseconds. The stock kernel caps a socket's buffer at net.core.rmem_max = 208 KiB, so
# the kernel drops part of every burst (counted as UdpRcvbufErrors in /proc/net/snmp) and the
# loss looks like a bad network: retransmits, bitrate cuts, a recovery spinner. Pulsar asks for
# 4 MiB per socket; these limits let it get that (16 MiB leaves headroom for other apps).
# Only the CAPS are raised: the defaults (rmem_default / wmem_default) stay as they are, so no
# other socket uses more memory than before. Remove this file to go back to the stock limits.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
