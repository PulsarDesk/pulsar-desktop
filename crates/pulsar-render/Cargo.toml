# Pulsar native renderer + overlay (separate process, spawned by the Tauri app).
#
# Why a separate binary and not a module in pulsar-tauri: linking EGL/GL into the
# Tauri binary wedges WebKitGTK's compositor on Linux (see HANDOFF §3 / memory
# native-renderer-all-platforms). As its own process it links GPU libs freely and
# renders into a child window of the Tauri window (the --wid the C vidsink used).
#
# The overlay UI (`overlay.rs`) is egui and backend-agnostic, so every platform
# draws the IDENTICAL overlay. Linux uses egui's GL backend (egui_glow) over the
# proven EGL/rkmpp DRM_PRIME path; Windows/macOS will use egui-wgpu (D3D12/Metal).
[package]
name = "pulsar-render"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "pulsar-render"
path = "src/main.rs"

[dependencies]
# `monochrome_emoji_fonts` = the NotoEmoji + emoji-icon-font fallbacks egui ≤0.36 bundled by
# default (0.37 made `default_fonts` opt-in and the emoji fonts a separate feature).
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
# Distinct icon glyphs for the overlay's category boxes + stat tiles. The bundled egui
# font has no emoji glyphs (📡🖥📊… rendered as tofu), so we install the Phosphor icon
# font into egui's `FontDefinitions` in `overlay::apply_theme` (the single shared font
# setup, called by ALL three backends — Linux egui_glow, the Windows custom D3D11 painter,
# and macOS eframe). Phosphor glyphs are just extra font glyphs in egui's atlas, so the
# Windows custom painter (`win/egui_paint.rs`) picks them up for free once they're in the
# Context's fonts before the atlas builds. 0.14 (newest) is built against egui 0.36, so it
# pulls a second, unused egui 0.36 into the tree: we only take its font bytes + icon `&str`
# constants and insert the font by hand (no egui types cross the version boundary).
egui-phosphor = "0.14"
# The app relays the host's FsEntries as one-line JSON over stdin (`fsjson …`)
# for the native Files view — tiny parse, no derives needed.
serde_json = "1"
# Big SO_RCVBUF on the RTP intake (the OS default — 64 KiB on Windows — overflows on
# IDR bursts at high fps and silently drops most of the stream).
socket2 = "0.6"
# Decode the cursor side-channel shape (small RGBA PNG over stdin) — needed by BOTH
# the Linux and Windows backends now that each draws the host pointer over the
# cursorless KMS video. `png` only (no full `image`): the payload is always our own
# tiny RGBA8 PNG (cursors ≤ 64 px).
png = "0.18"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
egui_glow = { version = "0.37", default-features = false }
# Must be the glow egui_glow 0.37 is built on (0.17) — its Painter takes our Arc<glow::Context>.
glow = "0.17"
khronos-egl = { version = "6", features = ["static"] }
x11 = { version = "2.21", features = ["xlib"] }
libc = "0.2"

# Video decode for the single-surface renderer: video + egui overlay in ONE GL context/window
# so the overlay is a child of the app window (moves/clips/stacks with it). Two presents:
# DRM_PRIME zero-copy (rkmpp) and a software planar-YUV upload (desktop, AV1 fallback).
#
# One version for every install (Cargo's `links = "ffmpeg"` forbids two, even split by
# target): the crate bindgens against the INSTALLED headers, so the same dep builds on the
# rkmpp boards' patched FFmpeg 4.4 (Orange Pi 5 / Ubuntu 22.04) AND desktop FFmpeg ≥7
# (where 4.4's bindgen broke on the removed avfft.h). The decode code sticks to the stable
# send/receive API, which exists in both.
ffmpeg-sys-next = { version = "8", default-features = false, features = ["avcodec", "avformat"] }

# Windows: native zero-copy renderer, Moonlight-style. Media Foundation HW decoder (DXVA →
# ID3D11Texture2D, no ffmpeg/libclang needed) → ID3D11VideoProcessor NV12→RGB → DXGI swapchain
# present on a CHILD HWND of the Tauri window (the Win32 analogue of Linux's X11 `--wid`). The
# SAME `overlay.rs` egui UI is drawn on the swapchain via egui-directx11. All COM via the
# `windows` crate (consistent with pulsar-capture's D3D11/NVENC host path).
# NOTE: egui-directx11 pins its own egui + windows versions (it forced egui 0.31 + windows 0.61
# when we were on egui 0.29 / windows 0.58), so the overlay is painted by our own minimal D3D11
# egui painter (`win/egui_paint.rs`), now at egui 0.37 / windows 0.62.
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Media_MediaFoundation",
]

# macOS still uses egui's winit+wgpu stack (Metal) for the overlay; native VideoToolbox→Metal
# child-NSView video is a later phase (Task 10). Same overlay.rs UI.
[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu"] }
