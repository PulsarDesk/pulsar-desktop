# Pulsar Setup — branded Windows installer (Discord-style bootstrapper, NOT a wizard).
#
# One small exe: brand visuals + a progress bar. The app payload (pulsar.exe +
# resources) is EMBEDDED as a zip at build time (`PULSAR_SETUP_PAYLOAD` env →
# build.rs → include_bytes!), so the installer works fully offline. It installs
# per-user to %LOCALAPPDATA%\Programs\Pulsar (no UAC), writes the HKCU uninstall
# registry entry + Start-Menu/Desktop shortcuts, copies itself as the uninstaller,
# and launches the app. `--uninstall` reverses all of it; `/S`/`--silent` installs
# headlessly (updater / scripted installs).
#
# The kernel drivers (Interception/ViGEmBus) are NOT installed here — they need
# admin + reboot. The app itself elevates at runtime (request_admin) and the
# driver payloads ship in resources/, so hosting still gets them; a client-only
# user never pays the UAC prompt.
[package]
name = "pulsar-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "pulsar-setup"
path = "src/main.rs"

[dependencies]
# Same eframe the render overlay uses (0.37) → shared workspace build cache.
# `x11`/`wayland` only keep the workspace building on Linux (the installer itself is
# Windows-only): eframe 0.37 no longer pulls winit's Linux backends in via glutin-winit's
# defaults, and winit refuses to compile with no backend. Both are no-ops on Windows.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_System_Registry",
	"Win32_Security",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
