name: CI

# Pull requests run this on its own. A push to main runs it as part of the main pipeline
# (release.yml), next to Platform smoke and the release builds: a failure there stops the
# whole run and nothing is published.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  actions: write # stop the whole run when a job fails (last step of each job)

# A newer push to a PR replaces its running check. Inside the main pipeline the group is the
# run itself (the pipeline queues its own runs, see release.yml).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Headless desktop-crate tests on every target OS + arch (incl. ARM Linux for
  # OrangePi / Raspberry Pi). `cargo test` runs the workspace default-members
  # (pulsar-capture) — the fast cross-platform suite. The Tauri app + native
  # renderer are compiled in release.yml. pulsar-core/-proto/-relay come from git.
  rust:
    name: Rust · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     name: linux-x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
          - { os: windows-latest,   name: windows-x64 }
          - { os: macos-latest,     name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # libudev for input/uinput on Linux; the rest match Tauri 2's webkit2gtk-4.1 base.
      - name: Install Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libwebkit2gtk-4.1-dev build-essential librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.name }}

      # Advisory: the tree predates current-stable rustfmt, so drift is reported
      # but does not block. (proto/relay are format-gated; the app is not, yet.)
      - name: rustfmt (advisory)
        if: matrix.name == 'linux-x64'
        continue-on-error: true
        run: cargo fmt --all --check

      - name: clippy (headless crate, advisory)
        if: matrix.name == 'linux-x64'
        continue-on-error: true
        run: cargo clippy -p pulsar-capture --all-targets --locked

      - name: Test
        run: cargo test --locked

      - name: Stop the whole run (a job failed)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}

  # Frontend (SvelteKit) type-check + unit tests. vitest's jsdom chain needs
  # require(ESM) → Node >= 22.12; bun stays the package manager / script runner.
  frontend:
    name: Frontend · svelte-check + unit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: svelte-check
        run: bun run check
      - name: Unit tests
        run: bun run test:unit
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: bun audit

      - name: Stop the whole run (a job failed)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}

  audit:
    name: Security audit (RustSec)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      # cargo-audit directly: rustsec/audit-check@v2 failed with "Not Found" while updating its
      # check run even when no vulnerability was found. Fails only on vulnerabilities, not warnings.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        # zip 4.6.1, pulled in only by tauri-plugin-updater — every 2.x (2.14.0 latest) still
        # requires zip ^4; the fix (zip >= 9) exists only in updater 3.0 (alpha). Not reachable
        # here: the advisories (0367-0369, 0429 = symlink-size abort) are in ZipArchive::extract, which the updater calls only
        # for a Windows `.zip` update and only AFTER the minisign signature check — we ship
        # `-setup.exe` (extract_exe path). Our own zip use (pulsar-setup) is on zip 9.
        # 0545 (AES entries) needs zip's `aes-crypto` feature: the updater builds zip with
        # default-features = false, so it is not compiled in. 0548 is in `ZipStreamReader`,
        # which the updater does not use (it extracts with `ZipArchive`).
        # REMOVE when tauri-plugin-updater ships zip >= 9 (re-run `cargo audit` to confirm).
        run: cargo audit --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369 --ignore RUSTSEC-2026-0429 --ignore RUSTSEC-2026-0545 --ignore RUSTSEC-2026-0548

      - name: Stop the whole run (a job failed)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}
