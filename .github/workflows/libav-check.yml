name: libav host check

# Manual: run the in-process libav host encoder tests (src-tauri/src/host/libav.rs) on Ubuntu
# 22.04 x86-64 — the release Linux build's base, with its FFmpeg 4.4 — at one or two commits, to
# tell a regression from an old fault (the smoke run crashed with SIGSEGV there).

on:
  workflow_dispatch:
    inputs:
      refs:
        description: 'commits to test, space separated'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      refs: ${{ steps.r.outputs.refs }}
    steps:
      - id: r
        run: echo "refs=$(printf '%s\n' ${{ inputs.refs }} | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  libav:
    needs: plan
    name: libav · ${{ matrix.ref }}
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y build-essential pkg-config cmake nasm clang gdb \
            libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev \
            libudev-dev libasound2-dev libpulse-dev libdbus-1-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxext-dev libxfixes-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxcursor-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libmpv-dev
          pkg-config --modversion libavcodec libavfilter
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: libav-check
      - uses: oven-sh/setup-bun@v2
      - name: Frontend build + bundled resources
        shell: bash
        run: |
          bun install --frozen-lockfile && bun run build
          bun scripts/fetch-ffmpeg.mjs
          cargo build --locked -p pulsar-render
          mkdir -p src-tauri/resources && cp target/debug/pulsar-render src-tauri/resources/pulsar-render
      - name: libav tests one at a time, under gdb for a backtrace
        shell: bash
        run: |
          cargo test --locked -p pulsar-tauri --lib --no-run 2>&1 | tail -3
          bin=$(ls -t target/debug/build/pulsar-tauri/*/out/pulsar_tauri-* target/debug/deps/pulsar_tauri-* 2>/dev/null | grep -v '\.d$' | head -1)
          echo "test binary: $bin"
          cd src-tauri
          gdb -q -batch -ex run -ex bt -ex "info threads" --args "$bin" host::libav --test-threads=1 2>&1 | tail -80
